<!doctype html>
<html lang="ko" data-release-mode="review">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4eee6" />
  <meta name="description" content="Name On My Mind — 이름 붙이기 어려운 마음을 천천히 만나보는 카드" />
  <title>Name On My Mind — Review Preview</title>
  <link rel="stylesheet" href="./assets/css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#daily-card">오늘의 카드로 건너뛰기</a>
  <div class="review-banner" role="status">로컬 검토 미리보기 · 아직 공개 승인되지 않은 카드입니다</div>
  <header class="site-header">
    <a class="wordmark" href="./" aria-label="Name On My Mind 홈">Name On My Mind</a>
    <p class="tagline">이 마음에도 이름이 있을까요?</p>
  </header>

  <main class="page-shell" id="app" aria-live="polite">
    <section class="daily-shell" id="daily-card" aria-labelledby="card-term">
      <p class="today-marker">오늘의 마음</p>
      <div id="card-illustration" class="card-illustration" aria-live="off"></div>
      <p id="poetic-line" class="poetic-line"></p>
      <div class="term-row">
        <h1 id="card-term" class="term"></h1>
        <p id="card-language" class="language"></p>
      </div>
      <p id="reflection-question" class="reflection-question"></p>
      <div class="card-actions">
        <button type="button" id="reveal-button" class="primary-action" aria-expanded="false" aria-controls="compact-meaning">뜻을 살짝 펼쳐보기</button>
        <a id="detail-link" class="text-link" href="#meaning">더 알아보기</a>
      </div>
      <div id="compact-meaning" class="compact-meaning" hidden></div>
    </section>

    <article id="detail" class="detail" aria-labelledby="detail-title">
      <header class="detail-header">
        <p class="detail-kicker">조금 더 깊이</p>
        <h2 id="detail-title">이 마음의 결을 읽어보기</h2>
      </header>

      <section id="meaning" tabindex="-1">
        <h3>의미</h3>
        <p id="verified-definition"></p>
        <p id="usage-context"></p>
      </section>

      <section id="languages" tabindex="-1">
        <h3>다른 언어에서 가까이 가보기</h3>
        <div id="comparisons" class="comparison-grid"></div>
      </section>

      <section id="culture" tabindex="-1">
        <h3>문화적 맥락</h3>
        <p id="cultural-context"></p>
      </section>

      <section id="evidence" tabindex="-1">
        <h3>근거와 발음</h3>
        <p id="verification-summary"></p>
        <audio id="pronunciation-audio" controls preload="none"></audio>
        <p id="audio-attribution" class="fine-print"></p>
        <details>
          <summary>참고한 자료 보기</summary>
          <ol id="reference-list" class="reference-list"></ol>
        </details>
      </section>
    </article>
  </main>

  <footer class="site-footer">
    <p>마음을 진단하지 않습니다. 서로 다른 언어가 마음을 어떻게 이름 붙이는지 천천히 살펴봅니다.</p>
  </footer>
  <script type="module" src="./src/ui/app.mjs"></script>
</body>
</html>
