name: Deploy NameOnMyMind to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate approved public source
        run: npm run validate:g4
      - name: Validate Korean language research
        run: npm run check:korean-language
      - name: Build externally authorized public bundle
        env:
          NAMEONMYMIND_EXTERNAL_PUBLISH_AUTHORIZED: "1"
        run: npm run build:public
      - name: Stage authorized research preview
        env:
          NAMEONMYMIND_RESEARCH_PREVIEW_PUBLISH_AUTHORIZED: "1"
        run: npm run stage:research-preview
      - name: Verify publication boundary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const build = JSON.parse(fs.readFileSync('public/BUILD_MANIFEST.json','utf8'));
          const data = JSON.parse(fs.readFileSync('public/data/manifest.json','utf8'));
          const preview = JSON.parse(fs.readFileSync('public/RESEARCH_PREVIEW_MANIFEST.json','utf8'));
          const stagedPreview = JSON.parse(fs.readFileSync('public/prototypes/g5-research-preview-20260918/manifest.json','utf8'));
          const expected = ['C0001','C0002','C0003','C0004','C0005'];
          if (JSON.stringify(build.card_ids) !== JSON.stringify(expected)) throw new Error('Unexpected Pages card set');
          if (!build.external_publish_authorized || !data.external_publish_authorized) throw new Error('Release authorization flag missing');
          if (fs.existsSync('public/data/cards/C0006.json')) throw new Error('G5 HOLD card leaked into product data');
          if (!preview.preview_web_publish_authorized || preview.product_release_authorized) throw new Error('Research preview authorization boundary invalid');
          if (preview.preview_card_count !== 16 || stagedPreview.card_count !== 16) throw new Error('Unexpected research preview card count');
          if (stagedPreview.cards.some(card => 'research_record' in card)) throw new Error('Internal research record path leaked into staged manifest');
          if (!fs.existsSync('public/preview/index.html')) throw new Error('Short preview alias missing');
          if (!fs.existsSync('public/learn/index.html')) throw new Error('Korean daily-learning alias missing');
          if (!fs.existsSync('public/prototypes/korean-daily-learning-20260923/index.html')) throw new Error('Korean daily-learning page missing');
          const korean = preview.korean_emotion_map;
          if (!korean || korean.product_release_authorized) throw new Error('Korean research-map release boundary invalid');
          if (korean.family_count !== 22 || korean.term_count !== 151 || korean.source_verified_term_count !== 151 || korean.level1_verified_term_count !== 38 || korean.level2_verified_term_count !== 72 || korean.level2_discovery_term_count !== 0 || korean.level3_verified_term_count !== 41 || korean.level3_discovery_term_count !== 0 || korean.school_age_direct_term_count !== 21 || korean.school_age_related_term_count !== 1 || korean.contrast_set_count !== 16) {
            throw new Error('Unexpected Korean emotion-map research counts');
          }
          for (const file of [
            'public/korean/index.html',
            'public/prototypes/korean-emotion-map-20260919/index.html',
            'public/content/korean-expression/emotion-map-v1.json',
            'public/content/korean-expression/simple-meanings-v1.json',
            'public/content/korean-expression/daily-pool-v1.json',
            'public/content/korean-expression/daily-pool-v2.json',
            'public/content/korean-expression/daily-pools.json',
            'public/content/korean-expression/evidence/school-age-v1.json',
            'public/content/korean-expression/evidence/level1-source-v1.json',
            'public/content/korean-expression/evidence/level2-exact-source-v1.json',
            'public/content/korean-expression/evidence/level2-followup-source-v2.json',
            'public/content/korean-expression/evidence/level3-exact-source-v1.json',
            'public/content/korean-expression/evidence/level3-followup-source-v2.json',
            'public/content/korean-expression/evidence/level3-followup-source-v3.json',
            'public/content/korean-expression/evidence/level3-followup-source-v4.json',
            'public/content/korean-expression/evidence/phrase-source-v1.json',
            'public/content/korean-expression/evidence/phrase-source-v2.json',
            'public/content/korean-expression/evidence/standard-dictionary-followup-v1.json',
          ]) if (!fs.existsSync(file)) throw new Error(`Korean research-map staged file missing: ${file}`);
          if (korean.daily_pool_v2_path !== 'content/korean-expression/daily-pool-v2.json' || korean.daily_pool_registry_path !== 'content/korean-expression/daily-pools.json') throw new Error('Korean daily pool v2/registry manifest path mismatch');
          if (korean.daily_learning_path !== 'prototypes/korean-daily-learning-20260923/' || korean.daily_learning_alias_path !== 'learn/') throw new Error('Korean daily-learning manifest path mismatch');
          if (korean.simple_meanings_path !== 'content/korean-expression/simple-meanings-v1.json') throw new Error('Korean simple meanings manifest path mismatch');
          const koreanHtml = fs.readFileSync('public/prototypes/korean-emotion-map-20260919/index.html','utf8');
          const dailyLearningHtml = fs.readFileSync('public/prototypes/korean-daily-learning-20260923/index.html','utf8');
          const publicApp = fs.readFileSync('public/src/ui/app.mjs','utf8');
          if (!koreanHtml.includes('상황에서 찾기') || !koreanHtml.includes('앱이 감정을 판정하지 않습니다.') || !koreanHtml.includes('3–6학년') || !koreanHtml.includes('1–2학년 적합성 판정을 뜻하지 않습니다.')) {
            throw new Error('Guided Korean articulation boundary missing');
          }
          if (!publicApp.includes('상황에서 마음말 찾기')) throw new Error('Guided Korean articulation entry link missing');
          if (!publicApp.includes('오늘의 한 문장') || !publicApp.includes('작성 내용은 저장하거나 전송하지 않습니다.')) throw new Error('Daily Korean reflection privacy boundary missing');
          if (!publicApp.includes('daily-pools.json') || !fs.existsSync('public/src/domain/korean-daily.mjs')) throw new Error('Versioned Korean daily-pool runtime missing');
          if (!dailyLearningHtml.includes('오늘의 마음말') || !dailyLearningHtml.includes('비슷한 말') || !dailyLearningHtml.includes('내 문장') || !dailyLearningHtml.includes('simple-meanings-v1.json')) throw new Error('Simple Korean daily-learning surface missing');
          if (dailyLearningHtml.includes('오늘의 학습 풀') || dailyLearningHtml.includes('151/151') || dailyLearningHtml.includes('근거 연결')) throw new Error('Korean daily-learning surface regressed to internal metadata clutter');
          console.log(JSON.stringify({status:'PASS',card_ids:build.card_ids,preview_card_count:preview.preview_card_count,korean_emotion_map:korean,guided_articulation:true,snapshot_version:build.snapshot_version,external_publish_authorized:true},null,2));
          NODE
      - name: Check private leakage
        run: npm run check:privacy
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
