<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f3ee">
  <meta name="description" content="오늘 하나의 마음말을 배우고 내 문장으로 써보는 NameOnMyMind 한국어 학습 페이지">
  <title>오늘의 마음말 — NameOnMyMind</title>
  <style>
    :root{
      color-scheme:light;
      --paper:#f7f3ee;
      --surface:#fffdf9;
      --ink:#27211d;
      --muted:#786f68;
      --line:#e2d9d1;
      --accent:#a95340;
      --soft:#f3e7df;
      --max:500px;
      --serif:Georgia,"Noto Serif KR","Apple SD Gothic Neo",serif;
      --sans:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    *{box-sizing:border-box}
    html{background:#ece5de}
    body{margin:0;min-height:100dvh;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
    button,input,textarea{font:inherit}
    button,a{-webkit-tap-highlight-color:transparent}
    a{color:inherit}
    .page{width:min(var(--max),100%);margin:0 auto;min-height:100dvh;padding:0 20px 44px}
    header{display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 0 18px}
    .brand{font:500 18px/1 var(--serif);letter-spacing:-.03em;text-decoration:none}
    .date{color:var(--muted);font-size:12px}
    .hero{padding:30px 0 28px;border-bottom:1px solid var(--line)}
    .label{margin:0 0 14px;color:var(--accent);font-size:12px;font-weight:800}
    h1{margin:0;font:500 clamp(52px,16vw,72px)/1 var(--serif);letter-spacing:-.06em}
    .meaning-label{margin:26px 0 7px;color:var(--muted);font-size:12px;font-weight:700}
    .meaning{margin:0;max-width:420px;font-size:21px;line-height:1.55;letter-spacing:-.02em;word-break:keep-all}
    .section{padding:28px 0;border-bottom:1px solid var(--line)}
    .section h2{margin:0 0 16px;font-size:18px;letter-spacing:-.025em}
    .similar-list{display:grid;gap:10px}
    .similar{padding:14px 15px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
    .similar strong{display:block;margin-bottom:5px;font:500 20px/1.1 var(--serif);letter-spacing:-.03em}
    .similar span{display:block;color:#5f5751;font-size:14px;line-height:1.55;word-break:keep-all}
    .sentence-guide{margin:0 0 12px;color:#5f5751;font-size:14px;line-height:1.6}
    textarea{display:block;width:100%;min-height:92px;padding:14px 15px;border:1px solid var(--line);border-radius:14px;background:white;color:var(--ink);font-size:15px;line-height:1.55;resize:vertical;outline:none}
    textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgb(169 83 64/.08)}
    textarea::placeholder{color:#aaa099}
    .privacy{margin:8px 0 0;color:#948982;font-size:11px}
    details.more{padding:24px 0 0}
    details.more>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:800}
    details.more>summary::-webkit-details-marker{display:none}
    details.more>summary::after{content:"＋";float:right;color:var(--muted);font-weight:400}
    details.more[open]>summary::after{content:"−"}
    .search-wrap{margin-top:16px}
    .search{width:100%;height:44px;padding:0 13px;border:1px solid var(--line);border-radius:12px;background:white;outline:none;font-size:14px}
    .search:focus{border-color:var(--accent)}
    .results{display:grid;gap:8px;margin-top:10px}
    .result{padding:12px 13px;border-radius:12px;background:white;border:1px solid var(--line);text-decoration:none}
    .result strong{display:block;margin-bottom:4px;font:500 18px/1.1 var(--serif)}
    .result span{display:block;color:#625a54;font-size:13px;line-height:1.5}
    .hint{margin:10px 0 0;color:var(--muted);font-size:11px}
    .source{margin-top:22px;font-size:11px;color:var(--muted)}
    .source summary{cursor:pointer}
    .source a{display:inline-block;margin-top:8px;color:var(--accent);font-weight:700}
    .error{margin-top:40px;padding:16px;border:1px solid #efd1c7;border-radius:14px;background:#fff5f1;color:#7c3b2d;font-size:14px;line-height:1.6}
    footer{padding:28px 0 calc(12px + env(safe-area-inset-bottom));color:#948982;font-size:11px;text-align:center}
    @media(min-width:501px){body{padding:18px 0}.page{background:rgb(255 253 249/.72);box-shadow:0 0 50px rgb(69 50 38/.05)}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
<div class="page">
  <header>
    <a class="brand" href="../../">NameOnMyMind</a>
    <span class="date" id="date"></span>
  </header>
  <main id="app"></main>
  <footer>하루에 마음말 하나.</footer>
</div>

<script type="module">
import { selectEffectiveKoreanDailyPool, resolveKoreanDailyVerifiedTerm } from '../../src/domain/korean-daily.mjs';

const app=document.querySelector('#app');
const dateNode=document.querySelector('#date');
const base='../../content/korean-expression/';
const esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=async p=>{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error('불러오지 못했습니다.');return r.json()};
const now=new Date();
dateNode.textContent=new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric'}).format(now);

function evidenceUrl(ref){
  if(/^KRD:\d+$/.test(ref||'')){const id=ref.split(':')[1];return `https://krdict.korean.go.kr/eng/dicSearch/SearchView?ParaWordNo=${id}&nation=eng`}
  if(/^STD:\d+$/.test(ref||'')){const id=ref.split(':')[1];return `https://stdict.korean.go.kr/search/searchView.do?word_no=${id}&searchKeywordTo=3`}
  return '';
}

try{
  const [data,meaningsData,registry,v1]=await Promise.all([
    read(base+'emotion-map-v1.json'),
    read(base+'simple-meanings-v1.json'),
    read(base+'daily-pools.json'),
    read(base+'daily-pool-v1.json')
  ]);

  const meta=selectEffectiveKoreanDailyPool(registry,now);
  let pool=v1;
  if(meta&&meta.pool_id!==v1.pool_id){
    const candidate=await read(base+meta.path);
    if(candidate.pool_id===meta.pool_id&&candidate.effective_date===meta.effective_date)pool=candidate;
  }

  const daily=resolveKoreanDailyVerifiedTerm(data,pool,now);
  if(!daily)throw new Error('오늘의 마음말을 고르지 못했습니다.');

  const meaningMap=new Map(meaningsData.entries.map(x=>[x.id,x]));
  const dailyMeaning=meaningMap.get(daily.id);
  if(!dailyMeaning)throw new Error('뜻을 찾지 못했습니다.');

  const directSet=data.contrast_sets.find(set=>set.status==='SOURCE_VERIFIED'&&set.terms.includes(daily.expression));
  let similarTerms=[];
  if(directSet){
    similarTerms=directSet.terms
      .filter(x=>x!==daily.expression)
      .map(x=>data.terms.find(t=>t.expression===x))
      .filter(Boolean);
  }
  if(similarTerms.length<3){
    const sameFamily=data.terms
      .filter(t=>t.family_id===daily.family_id&&t.id!==daily.id&&!similarTerms.some(x=>x.id===t.id))
      .sort((a,b)=>Math.abs(a.level-daily.level)-Math.abs(b.level-daily.level)||a.id.localeCompare(b.id,'en'));
    similarTerms=[...similarTerms,...sameFamily].slice(0,3);
  } else {
    similarTerms=similarTerms.slice(0,3);
  }

  const sourceUrl=evidenceUrl(daily.evidence_ref);

  app.innerHTML=`
    <section class="hero">
      <p class="label">오늘의 마음말</p>
      <h1>${esc(daily.expression)}</h1>
      <p class="meaning-label">뜻</p>
      <p class="meaning">${esc(dailyMeaning.meaning)}</p>
    </section>

    <section class="section">
      <h2>비슷한 말</h2>
      <div class="similar-list">
        ${similarTerms.map(t=>{
          const m=meaningMap.get(t.id);
          return `<div class="similar"><strong>${esc(t.expression)}</strong><span>${esc(m?.meaning||'')}</span></div>`;
        }).join('')}
      </div>
    </section>

    <section class="section">
      <h2>내 문장</h2>
      <p class="sentence-guide">오늘 있었던 일에 이 말을 한 번 써보세요.</p>
      <textarea id="sentence" maxlength="120" placeholder="예: 오늘은 …해서 ${esc(daily.expression)}."></textarea>
      <p class="privacy">여기에 쓴 글은 저장되지 않아요.</p>
    </section>

    <details class="more">
      <summary>다른 마음말 찾기</summary>
      <div class="search-wrap">
        <input class="search" id="search" type="search" placeholder="단어를 찾아보세요">
        <div class="results" id="results"></div>
        <p class="hint" id="hint">예: 서운하다, 뿌듯하다, 고요하다</p>
      </div>
    </details>

    ${sourceUrl?`<details class="source"><summary>뜻 출처</summary><a href="${esc(sourceUrl)}" target="_blank" rel="noopener">국립국어원에서 보기</a></details>`:''}
  `;

  const search=document.querySelector('#search');
  const results=document.querySelector('#results');
  const hint=document.querySelector('#hint');

  function renderSearch(){
    const q=search.value.trim();
    results.replaceChildren();
    hint.hidden=Boolean(q);
    if(!q)return;
    const rows=data.terms
      .filter(t=>t.expression.includes(q)||meaningMap.get(t.id)?.meaning?.includes(q))
      .slice(0,8);
    if(!rows.length){
      results.innerHTML='<p class="hint">찾은 단어가 없어요.</p>';
      return;
    }
    for(const t of rows){
      const m=meaningMap.get(t.id);
      const a=document.createElement('a');
      a.className='result';
      a.href=`../korean-emotion-map-20260919/?family=${encodeURIComponent(t.family_id)}&term=${encodeURIComponent(t.expression)}`;
      a.innerHTML=`<strong>${esc(t.expression)}</strong><span>${esc(m?.meaning||'')}</span>`;
      results.append(a);
    }
  }
  search.addEventListener('input',renderSearch);
}catch(error){
  console.error(error);
  app.innerHTML=`<div class="error">페이지를 불러오지 못했습니다.<br>잠시 뒤 다시 열어주세요.</div>`;
}
</script>
</body>
</html>
